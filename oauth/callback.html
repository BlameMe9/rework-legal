<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth Callback — Rework</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.55;
    }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
    p.subtitle { margin: 0 0 2rem; opacity: .75; }
    section { margin: 1.25rem 0; }
    label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; margin-bottom: .25rem; }
    .code-box {
      display: flex;
      gap: .5rem;
      align-items: stretch;
    }
    code {
      flex: 1;
      padding: .75rem .9rem;
      background: rgba(127,127,127,.12);
      border: 1px solid rgba(127,127,127,.25);
      border-radius: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: .9rem;
      word-break: break-all;
      user-select: all;
    }
    button {
      padding: .75rem 1rem;
      border: 1px solid rgba(127,127,127,.25);
      background: rgba(127,127,127,.08);
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: rgba(127,127,127,.18); }
    button.copied { background: #16a34a; color: white; border-color: #16a34a; }
    .meta { font-size: .85rem; opacity: .75; }
    .meta code { font-size: .8rem; padding: .15rem .35rem; }
    .error {
      padding: 1rem;
      background: rgba(220,38,38,.1);
      border: 1px solid rgba(220,38,38,.4);
      border-radius: 8px;
      color: #b91c1c;
    }
    .hint {
      margin-top: 2rem;
      padding: 1rem 1.1rem;
      border-left: 3px solid #6366f1;
      background: rgba(99,102,241,.08);
      border-radius: 4px;
      font-size: .92rem;
    }
    .hint strong { display: block; margin-bottom: .25rem; }
  </style>
</head>
<body>
  <h1>OAuth callback</h1>
  <p class="subtitle">Copy the authorization code and paste it into your local tool.</p>

  <div id="success" style="display:none">
    <section>
      <label>Authorization code</label>
      <div class="code-box">
        <code id="code">—</code>
        <button id="copy" type="button">Copy</button>
      </div>
    </section>

    <section class="meta">
      <div><label>State</label><code id="state">—</code></div>
      <div style="margin-top:.75rem"><label>Scopes granted</label><code id="scopes">—</code></div>
    </section>

    <div class="hint">
      <strong>Next step</strong>
      Paste the code above back into Claude Code. It will exchange the code for an access token (runs the
      <code>/v2/oauth/token/</code> call locally using your client secret) and write the token to
      <code>.env.local</code>.
    </div>
  </div>

  <div id="error" class="error" style="display:none">
    <strong id="error-kind">Error</strong>
    <div id="error-msg" style="margin-top:.4rem"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var scopes = params.get("scopes");
      var errorKind = params.get("error");
      var errorDesc = params.get("error_description");

      if (errorKind) {
        document.getElementById("error").style.display = "block";
        document.getElementById("error-kind").textContent = errorKind;
        document.getElementById("error-msg").textContent = errorDesc || "(no description provided)";
        return;
      }

      if (!code) {
        document.getElementById("error").style.display = "block";
        document.getElementById("error-kind").textContent = "No code in URL";
        document.getElementById("error-msg").textContent =
          "This page expects ?code=... in the URL. If you landed here directly, start the OAuth flow from your local tool.";
        return;
      }

      document.getElementById("success").style.display = "block";
      document.getElementById("code").textContent = code;
      document.getElementById("state").textContent = state || "(none)";
      document.getElementById("scopes").textContent = scopes || "(none)";

      var btn = document.getElementById("copy");
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = "Copied";
          btn.classList.add("copied");
          setTimeout(function () {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1500);
        });
      });
    })();
  </script>
</body>
</html>
